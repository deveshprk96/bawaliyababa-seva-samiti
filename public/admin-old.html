<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendor Admin Panel - Queue Management</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .login-container {
            max-width: 400px;
            margin: 100px auto;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .dashboard {
            display: none;
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 20px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        h1 {
            color: #f5576c;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .logout-btn {
            padding: 12px 30px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.3s ease;
        }

        .logout-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(245, 87, 108, 0.4);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            text-align: center;
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        .stat-card h3 {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .stat-card .number {
            font-size: 3em;
            font-weight: 700;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .settings-section {
            background: white;
            padding: 30px;
            border-radius: 20px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .settings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1em;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #f5576c;
            box-shadow: 0 0 0 3px rgba(245, 87, 108, 0.1);
        }

        .btn {
            padding: 15px 30px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
            font-size: 1em;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(245, 87, 108, 0.4);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .appointments-section {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .appointments-section h2 {
            color: #f5576c;
            margin-bottom: 20px;
        }

        .appointment-card {
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 15px;
            transition: all 0.3s ease;
        }

        .appointment-card:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
        }

        .appointment-card.in-progress {
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            border: 3px solid #4facfe;
        }

        .appointment-card.completed {
            background: linear-gradient(135deg, #d299c2 0%, #fef9d7 100%);
            opacity: 0.7;
        }

        .appointment-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .appointment-name {
            font-size: 1.3em;
            font-weight: 700;
            color: #333;
        }

        .appointment-status {
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.85em;
            text-transform: uppercase;
        }

        .status-waiting {
            background: #ffd93d;
            color: #333;
        }

        .status-in-progress {
            background: #6bcf7f;
            color: white;
        }

        .status-completed {
            background: #95a5a6;
            color: white;
        }

        .appointment-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            margin-bottom: 15px;
            font-size: 0.9em;
            color: #555;
        }

        .appointment-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .action-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .start-btn {
            background: #6bcf7f;
            color: white;
        }

        .start-btn:hover {
            background: #5ab56e;
            transform: scale(1.05);
        }

        .complete-btn {
            background: #3498db;
            color: white;
        }

        .complete-btn:hover {
            background: #2980b9;
            transform: scale(1.05);
        }

        .message {
            padding: 15px;
            border-radius: 10px;
            margin: 15px 0;
            text-align: center;
            font-weight: 600;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
            font-size: 1.2em;
        }

        .empty-state .emoji {
            font-size: 4em;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                text-align: center;
                gap: 20px;
            }

            h1 {
                font-size: 2em;
            }

            .appointment-header {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <!-- Login Screen -->
    <div class="login-container" id="loginContainer">
        <h1 style="text-align: center; margin-bottom: 30px; color: #f5576c;">🔐 Vendor Login</h1>
        <form id="loginForm">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" required placeholder="Enter username">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" required placeholder="Enter password">
            </div>
            <button type="submit" class="btn" style="width: 100%;">Login</button>
        </form>
        <div id="loginMessage"></div>
        <div style="text-align: center; margin-top: 20px;">
            <a href="/" style="color: #f5576c; text-decoration: none; font-weight: 600;">← Back to Customer Page</a>
        </div>
    </div>

    <!-- Dashboard -->
    <div class="dashboard" id="dashboard">
        <div class="header">
            <h1>🎯 Queue Management Dashboard</h1>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>

        <div class="stats">
            <div class="stat-card">
                <h3>⏳ Waiting</h3>
                <div class="number" id="waitingCount">0</div>
            </div>
            <div class="stat-card">
                <h3>▶️ In Progress</h3>
                <div class="number" id="inProgressCount">0</div>
            </div>
            <div class="stat-card">
                <h3>✅ Completed Today</h3>
                <div class="number" id="completedCount">0</div>
            </div>
            <div class="stat-card">
                <h3>📊 Total</h3>
                <div class="number" id="totalCount">0</div>
            </div>
        </div>

        <div class="settings-section">
            <h2 style="color: #f5576c; margin-bottom: 20px;">⚙️ Business Settings</h2>
            <form id="settingsForm">
                <div class="settings-grid">
                    <div class="form-group">
                        <label>Business Name</label>
                        <input type="text" id="businessName" required>
                    </div>
                    <div class="form-group">
                        <label>Latitude</label>
                        <input type="number" step="0.000001" id="latitude" required>
                    </div>
                    <div class="form-group">
                        <label>Longitude</label>
                        <input type="number" step="0.000001" id="longitude" required>
                    </div>
                    <div class="form-group">
                        <label>Radius (meters)</label>
                        <input type="number" id="radiusMeters" required>
                    </div>
                </div>
                <button type="submit" class="btn">Save Settings</button>
            </form>
            <div id="settingsMessage"></div>
        </div>

        <div class="appointments-section">
            <h2>📋 Appointments Queue</h2>
            <div id="appointmentsList"></div>
        </div>
    </div>

    <script>
        let credentials = null;
        let refreshInterval = null;

        // Login
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const result = await response.json();

                if (response.ok) {
                    credentials = { username, password };
                    document.getElementById('loginContainer').style.display = 'none';
                    document.getElementById('dashboard').style.display = 'block';
                    await loadDashboard();
                    refreshInterval = setInterval(loadAppointments, 5000); // Auto-refresh every 5 seconds
                } else {
                    showLoginMessage('Invalid credentials', 'error');
                }
            } catch (error) {
                showLoginMessage('Login failed', 'error');
            }
        });

        function logout() {
            credentials = null;
            clearInterval(refreshInterval);
            document.getElementById('loginContainer').style.display = 'block';
            document.getElementById('dashboard').style.display = 'none';
            document.getElementById('loginForm').reset();
        }

        async function loadDashboard() {
            await Promise.all([loadSettings(), loadAppointments()]);
        }

        async function loadSettings() {
            try {
                const response = await fetch('/api/vendor-settings');
                const settings = await response.json();

                document.getElementById('businessName').value = settings.businessName;
                document.getElementById('latitude').value = settings.latitude;
                document.getElementById('longitude').value = settings.longitude;
                document.getElementById('radiusMeters').value = settings.radiusMeters;
            } catch (error) {
                console.error('Error loading settings:', error);
            }
        }

        document.getElementById('settingsForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const settings = {
                businessName: document.getElementById('businessName').value,
                latitude: parseFloat(document.getElementById('latitude').value),
                longitude: parseFloat(document.getElementById('longitude').value),
                radiusMeters: parseInt(document.getElementById('radiusMeters').value)
            };

            try {
                const response = await fetch('/api/vendor-settings', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'username': credentials.username,
                        'password': credentials.password
                    },
                    body: JSON.stringify(settings)
                });

                const result = await response.json();
                showSettingsMessage(result.message || 'Settings saved!', 'success');
            } catch (error) {
                showSettingsMessage('Error saving settings', 'error');
            }
        });

        async function loadAppointments() {
            try {
                const response = await fetch('/api/appointments', {
                    headers: {
                        'username': credentials.username,
                        'password': credentials.password
                    }
                });

                const appointments = await response.json();
                displayAppointments(appointments);
                updateStats(appointments);
            } catch (error) {
                console.error('Error loading appointments:', error);
            }
        }

        function displayAppointments(appointments) {
            const container = document.getElementById('appointmentsList');
            
            if (appointments.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="emoji">📭</div>
                        <div>No appointments yet</div>
                    </div>
                `;
                return;
            }

            container.innerHTML = appointments.map(apt => `
                <div class="appointment-card ${apt.status}">
                    <div class="appointment-header">
                        <div class="appointment-name">👤 ${apt.customerName}</div>
                        <span class="appointment-status status-${apt.status}">
                            ${apt.status.replace('-', ' ')}
                        </span>
                    </div>
                    <div class="appointment-details">
                        <div>📱 ${apt.customerPhone}</div>
                        <div>📧 ${apt.customerEmail}</div>
                        <div>🕒 ${new Date(apt.timestamp).toLocaleString()}</div>
                        ${apt.startTime ? `<div>▶️ Started: ${new Date(apt.startTime).toLocaleTimeString()}</div>` : ''}
                        ${apt.endTime ? `<div>✅ Ended: ${new Date(apt.endTime).toLocaleTimeString()}</div>` : ''}
                    </div>
                    ${apt.notes ? `<div style="margin-bottom: 10px; color: #666;">📝 ${apt.notes}</div>` : ''}
                    <div class="appointment-actions">
                        ${apt.status === 'waiting' ? `
                            <button class="action-btn start-btn" onclick="startAppointment(${apt.id})">
                                ▶️ Start Appointment
                            </button>
                        ` : ''}
                        ${apt.status === 'in-progress' ? `
                            <button class="action-btn complete-btn" onclick="completeAppointment(${apt.id})">
                                ✅ Complete Appointment
                            </button>
                        ` : ''}
                    </div>
                </div>
            `).join('');
        }

        function updateStats(appointments) {
            const waiting = appointments.filter(a => a.status === 'waiting').length;
            const inProgress = appointments.filter(a => a.status === 'in-progress').length;
            const today = new Date().toDateString();
            const completed = appointments.filter(a => 
                a.status === 'completed' && 
                new Date(a.timestamp).toDateString() === today
            ).length;

            document.getElementById('waitingCount').textContent = waiting;
            document.getElementById('inProgressCount').textContent = inProgress;
            document.getElementById('completedCount').textContent = completed;
            document.getElementById('totalCount').textContent = appointments.length;
        }

        async function startAppointment(id) {
            try {
                const response = await fetch(`/api/appointments/${id}/start`, {
                    method: 'POST',
                    headers: {
                        'username': credentials.username,
                        'password': credentials.password
                    }
                });

                if (response.ok) {
                    await loadAppointments();
                }
            } catch (error) {
                console.error('Error starting appointment:', error);
            }
        }

        async function completeAppointment(id) {
            try {
                const response = await fetch(`/api/appointments/${id}/complete`, {
                    method: 'POST',
                    headers: {
                        'username': credentials.username,
                        'password': credentials.password
                    }
                });

                if (response.ok) {
                    await loadAppointments();
                }
            } catch (error) {
                console.error('Error completing appointment:', error);
            }
        }

        function showLoginMessage(text, type) {
            const div = document.getElementById('loginMessage');
            div.textContent = text;
            div.className = `message ${type}`;
        }

        function showSettingsMessage(text, type) {
            const div = document.getElementById('settingsMessage');
            div.textContent = text;
            div.className = `message ${type}`;
            setTimeout(() => div.style.display = 'none', 3000);
        }
    </script>
</body>
</html>
